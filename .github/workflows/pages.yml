name: Test and publish UT2K4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node arena/test.mjs
          node tests/test-hosted-mod.cjs
          curl --fail --silent --show-error --location --retry 3 https://github.com/rgnv/ut2004-wasm/releases/download/v0.2.0/ut2004-web-v0.2.0.tar.gz -o "$RUNNER_TEMP/ut2004-web.tar.gz"
          echo "946071180231747b43217886fa52190187031ae94ad54343c41788e75702c259  $RUNNER_TEMP/ut2004-web.tar.gz" | sha256sum --check
          node delivery/test-native-import.cjs "$RUNNER_TEMP/ut2004-web.tar.gz"
          for script in delivery/*.js; do node --check "$script"; done
          tools/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
