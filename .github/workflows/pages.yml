name: Test and publish UT2K4
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/mirror-collection-resume-test.py
          node arena/test.mjs
          node tests/test-hosted-mod.cjs
          node tests/test-matrix-source.cjs
          node tests/test_launch_origin.cjs
          python3 tools/check-assist-source.py
          node --test runtime/collection/test.mjs
          node runtime/collection/startup-policy.test.mjs
          node runtime/collection/menu-touch.test.mjs
          node runtime/collection/pointer-capture.test.mjs
          node runtime/collection/assist-client.test.cjs
          node runtime/collection/pad-native-routing.test.cjs
          curl --fail --silent --show-error --location --retry 3 https://github.com/rgnv/ut2004-wasm/releases/download/v0.2.0/ut2004-web-v0.2.0.tar.gz -o "$RUNNER_TEMP/ut2004-web.tar.gz"
          echo "946071180231747b43217886fa52190187031ae94ad54343c41788e75702c259  $RUNNER_TEMP/ut2004-web.tar.gz" | sha256sum --check
          node delivery/test-native-import.cjs "$RUNNER_TEMP/ut2004-web.tar.gz"
          for script in delivery/*.js; do node --check "$script"; done
          tools/build-site.sh
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
